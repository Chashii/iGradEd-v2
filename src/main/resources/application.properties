spring.application.name=iGradEd
server.port=8080

# Used to decide which date is "today" on the calendar
igraded.timezone=Asia/Manila

spring.thymeleaf.cache=false

# All data lives in a local H2 database file (./data/igraded.mv.db).
# H2 runs in PostgreSQL mode so the same SQL works when we move to PostgreSQL (see docs/DATABASE.md).
spring.datasource.url=jdbc:h2:file:./data/igraded;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# The tables are created by the Flyway scripts in src/main/resources/db/migration, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The first Super Admin is created on first start if none exists.
# Set a password with the IGRADED_SUPERADMIN_PASSWORD environment variable.
# If it is empty, a random password is generated and printed once in the console.
igraded.superadmin.email=${IGRADED_SUPERADMIN_EMAIL:superadmin@igraded.local}
igraded.superadmin.password=${IGRADED_SUPERADMIN_PASSWORD:}

# Locker: where uploaded files are kept on disk (git-ignored), and the size limits.
# Each teacher's total space is users.storage_quota_bytes (2 GB by default).
igraded.locker.dir=./data/locker
igraded.locker.max-file-bytes=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
